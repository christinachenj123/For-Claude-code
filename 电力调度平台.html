<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1440"/>
  <title>电力调度管理平台</title>
  <style>
/* ============================================
   电力系统调度平台 - 设计令牌
   ============================================ */

:root {
  /* 主色 - 科技蓝 */
  --primary: #0A6CFF;
  --primary-hover: #2D85FF;
  --primary-active: #0856D6;
  --primary-glow: rgba(10, 108, 255, 0.45);
  --primary-soft: rgba(10, 108, 255, 0.12);
  --primary-border: rgba(10, 108, 255, 0.32);

  /* 背景层级 (深色科技风) */
  --bg-base: #050B1A;
  --bg-canvas: #08111F;
  --bg-elevated: #0E1A2E;
  --bg-card: #101D33;
  --bg-card-hover: #142441;
  --bg-overlay: rgba(8, 17, 31, 0.72);

  /* 边框 / 分割线 */
  --border: rgba(120, 160, 220, 0.14);
  --border-strong: rgba(120, 160, 220, 0.24);
  --border-glow: rgba(10, 108, 255, 0.5);

  /* 文本 */
  --text-1: #EAF2FF;
  --text-2: #A7B6CF;
  --text-3: #6B7C99;
  --text-mute: #4A5874;

  /* 状态色 */
  --success: #22D38A;
  --success-soft: rgba(34, 211, 138, 0.14);
  --warning: #FFAB2D;
  --warning-soft: rgba(255, 171, 45, 0.14);
  --danger: #FF4E6A;
  --danger-soft: rgba(255, 78, 106, 0.14);
  --info: #25C6FF;
  --info-soft: rgba(37, 198, 255, 0.14);
  --purple: #9D7BFF;
  --teal: #2EE6D6;

  /* 图表色板 */
  --chart-1: #0A6CFF;
  --chart-2: #25C6FF;
  --chart-3: #2EE6D6;
  --chart-4: #9D7BFF;
  --chart-5: #FFAB2D;
  --chart-6: #FF4E6A;

  /* 字号 */
  --fs-xs: 11px;
  --fs-sm: 12px;
  --fs-base: 13px;
  --fs-md: 14px;
  --fs-lg: 16px;
  --fs-xl: 20px;
  --fs-2xl: 28px;
  --fs-3xl: 40px;
  --fs-4xl: 56px;

  /* 间距 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;

  /* 圆角 */
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;

  /* 阴影 / 发光 */
  --glow-sm: 0 0 12px var(--primary-glow);
  --glow-md: 0 0 24px var(--primary-glow);
  --shadow-card: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.35);

  /* 字体 */
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --font-digit: "DIN Alternate", "DIN Condensed", "Bebas Neue", -apple-system, sans-serif;
}

/* ============= 浅色主题 ============= */
:root[data-theme="light"] {
  --bg-base: #F2F5FB;
  --bg-canvas: #F7F9FD;
  --bg-elevated: #FFFFFF;
  --bg-card: #FFFFFF;
  --bg-card-hover: #F2F5FB;
  --bg-overlay: rgba(255, 255, 255, 0.85);
  --border: rgba(15, 30, 60, 0.08);
  --border-strong: rgba(15, 30, 60, 0.16);
  --text-1: #0B1B33;
  --text-2: #4A5874;
  --text-3: #7A8AA6;
  --text-mute: #A6B3C8;
  --shadow-card: 0 1px 2px rgba(15,30,60,0.04), 0 4px 16px rgba(15,30,60,0.06);
}

/* ============= 圆角变体 ============= */
:root[data-radius="sharp"] {
  --r-sm: 0px; --r-md: 2px; --r-lg: 4px; --r-xl: 6px;
}
:root[data-radius="soft"] {
  --r-sm: 6px; --r-md: 12px; --r-lg: 18px; --r-xl: 24px;
}

/* ============= 密度变体 ============= */
:root[data-density="compact"] {
  --fs-base: 12px; --fs-md: 13px; --fs-lg: 15px;
  --sp-3: 8px; --sp-4: 12px; --sp-5: 14px; --sp-6: 18px;
}
:root[data-density="comfortable"] {
  --fs-base: 14px; --fs-md: 16px; --fs-lg: 18px;
  --sp-3: 14px; --sp-4: 20px; --sp-5: 24px; --sp-6: 28px;
}

/* ============= 基础 ============= */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  color: var(--text-1);
  background: var(--bg-base);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
input, select, textarea { font-family: inherit; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }

/* ============= App Shell ============= */
.app {
  display: grid;
  grid-template-columns: 220px 1fr;
  grid-template-rows: 56px 1fr;
  height: 100vh;
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(10,108,255,0.10), transparent 60%),
    radial-gradient(900px 500px at 95% 110%, rgba(37,198,255,0.06), transparent 60%),
    var(--bg-base);
}

/* Sidebar */
.sidebar {
  grid-row: 1 / 3;
  background: linear-gradient(180deg, rgba(14,26,46,0.85), rgba(8,17,31,0.85));
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(20px);
}
.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
}
.sidebar-brand .logo {
  width: 28px; height: 28px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--primary), var(--info));
  display: grid; place-items: center;
  box-shadow: 0 0 16px var(--primary-glow);
  position: relative;
}
.sidebar-brand .logo svg { width: 18px; height: 18px; color: white; }
.sidebar-brand h1 {
  font-size: 15px;
  margin: 0;
  letter-spacing: 1px;
  font-weight: 600;
}
.sidebar-brand .sub { font-size: 10px; color: var(--text-3); letter-spacing: 2px; }

.nav {
  flex: 1;
  padding: 12px 10px;
  display: flex; flex-direction: column;
  gap: 2px;
  overflow-y: auto;
}
.nav-section {
  font-size: 10px;
  color: var(--text-mute);
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 14px 12px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  color: var(--text-2);
  font-size: var(--fs-md);
  cursor: pointer;
  position: relative;
  transition: all .15s ease;
}
.nav-item:hover { background: var(--bg-card-hover); color: var(--text-1); }
.nav-item.active {
  background: linear-gradient(90deg, var(--primary-soft), transparent);
  color: var(--text-1);
}
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
  background: var(--primary); border-radius: 2px;
  box-shadow: 0 0 8px var(--primary-glow);
}
.nav-item .icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; }
.nav-item.active .icon { color: var(--primary); opacity: 1; }
.nav-item .badge {
  margin-left: auto;
  background: var(--danger);
  color: white;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  min-width: 16px; text-align: center;
}

.sidebar-user {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--purple));
  display: grid; place-items: center;
  color: white; font-weight: 600; font-size: 12px;
}
.user-info { line-height: 1.3; }
.user-info .name { font-size: 13px; }
.user-info .role { font-size: 10px; color: var(--text-3); }

/* Topbar */
.topbar {
  display: flex; align-items: center;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(8, 17, 31, 0.6);
  backdrop-filter: blur(20px);
  gap: 20px;
  position: relative;
  z-index: 5;
}
.topbar .crumb { color: var(--text-2); font-size: var(--fs-md); }
.topbar .crumb b { color: var(--text-1); font-weight: 500; }
.topbar .clock {
  margin-left: auto;
  display: flex; align-items: center; gap: 14px;
  font-size: var(--fs-md);
  color: var(--text-2);
}
.topbar .clock .time {
  font-family: var(--font-digit);
  color: var(--text-1);
  font-size: 16px;
  letter-spacing: 1px;
}
.topbar .icon-btn {
  width: 32px; height: 32px;
  border-radius: var(--r-md);
  display: grid; place-items: center;
  color: var(--text-2);
  position: relative;
}
.topbar .icon-btn:hover { background: var(--bg-card-hover); color: var(--text-1); }
.topbar .icon-btn .dot {
  position: absolute; top: 6px; right: 6px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--danger); box-shadow: 0 0 6px var(--danger);
}
.topbar .env-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--success-soft);
  color: var(--success);
  border: 1px solid rgba(34,211,138,0.3);
  letter-spacing: 1px;
}

/* Main content */
.main {
  overflow-y: auto;
  padding: 18px 20px;
  position: relative;
}

/* ============= Reusable Components ============= */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
}
.card.glow { border-color: var(--primary-border); }
.card.glow::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--primary-soft), transparent 40%);
  pointer-events: none;
}
.card-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.card-header h3 {
  margin: 0;
  font-size: var(--fs-md);
  font-weight: 500;
  letter-spacing: 0.5px;
}
.card-header .tag {
  font-size: 10px; color: var(--primary);
  border: 1px solid var(--primary-border);
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--primary-soft);
  letter-spacing: 1px;
}
.card-header .live-dot {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--success);
}
.card-header .live-dot::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--success);
  box-shadow: 0 0 6px var(--success);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}
.card-header .actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.card-body { padding: 16px; }
.card-decoration {
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  opacity: 0.4;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border-radius: var(--r-sm);
  font-size: var(--fs-base);
  border: 1px solid var(--border-strong);
  background: var(--bg-card);
  color: var(--text-2);
  transition: all .15s;
}
.btn:hover { background: var(--bg-card-hover); color: var(--text-1); border-color: var(--primary-border); }
.btn.primary {
  background: linear-gradient(180deg, var(--primary), var(--primary-active));
  color: white;
  border-color: var(--primary);
  box-shadow: 0 0 12px var(--primary-glow);
}
.btn.primary:hover { background: var(--primary-hover); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.icon-only { padding: 6px; width: 28px; height: 28px; justify-content: center; }
.btn.sm { padding: 3px 8px; font-size: 11px; }

/* Chips & Tags */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  background: var(--bg-card-hover);
  color: var(--text-2);
}
.chip.success { background: var(--success-soft); color: var(--success); }
.chip.warning { background: var(--warning-soft); color: var(--warning); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.dot::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: currentColor;
}

/* Tabs */
.tabs {
  display: flex; gap: 4px;
  border-bottom: 1px solid var(--border);
}
.tab {
  padding: 10px 16px;
  font-size: var(--fs-md);
  color: var(--text-2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all .15s;
}
.tab:hover { color: var(--text-1); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* Table */
table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-base);
}
table.data th {
  text-align: left;
  padding: 10px 12px;
  font-weight: 500;
  color: var(--text-3);
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
table.data td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text-1);
}
table.data tr:hover td { background: rgba(10,108,255,0.04); }
table.data tr.selected td { background: var(--primary-soft); }

/* KPI */
.kpi {
  position: relative;
  padding: 16px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.kpi::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--accent, var(--primary));
  box-shadow: 0 0 12px var(--accent, var(--primary));
}
.kpi .label {
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.kpi .value {
  font-family: var(--font-digit);
  font-size: 32px;
  color: var(--text-1);
  margin: 6px 0 2px;
  font-weight: 500;
  letter-spacing: 1px;
}
.kpi .value .unit { font-size: 14px; color: var(--text-3); margin-left: 4px; }
.kpi .meta { font-size: 11px; color: var(--text-3); display: flex; gap: 10px; align-items: center; }
.kpi .delta { display: inline-flex; gap: 2px; align-items: center; }
.kpi .delta.up { color: var(--success); }
.kpi .delta.down { color: var(--danger); }
.kpi .spark {
  position: absolute; right: 12px; bottom: 12px; opacity: 0.6;
}

/* Status pills */
.status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
}
.status-pill::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
}
.status-pill.normal { color: var(--success); }
.status-pill.normal::before { background: var(--success); box-shadow: 0 0 6px var(--success); }
.status-pill.warning { color: var(--warning); }
.status-pill.warning::before { background: var(--warning); box-shadow: 0 0 6px var(--warning); }
.status-pill.danger { color: var(--danger); }
.status-pill.danger::before { background: var(--danger); box-shadow: 0 0 6px var(--danger); animation: pulse 1.2s infinite; }
.status-pill.offline { color: var(--text-3); }
.status-pill.offline::before { background: var(--text-mute); }

/* Search */
.search {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  border-radius: var(--r-md);
  background: var(--bg-card-hover);
  border: 1px solid transparent;
  color: var(--text-2);
}
.search:focus-within { border-color: var(--primary-border); background: var(--bg-elevated); }
.search input {
  background: none; border: none; outline: none;
  width: 200px;
  font-size: var(--fs-base);
}
.search input::placeholder { color: var(--text-mute); }

/* Topo background grid */
.grid-bg {
  background-image:
    linear-gradient(rgba(10,108,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(10,108,255,0.04) 1px, transparent 1px);
  background-size: 32px 32px;
}

/* Misc helpers */
.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.gap-6 { gap: 24px; }
.row { display: flex; gap: 16px; }
.grid { display: grid; gap: 16px; }
.mb-2 { margin-bottom: 8px; }
.mb-4 { margin-bottom: 16px; }
.text-2 { color: var(--text-2); }
.text-3 { color: var(--text-3); }
.text-mute { color: var(--text-mute); }
.text-sm { font-size: var(--fs-sm); }
.text-xs { font-size: var(--fs-xs); }
.text-digit { font-family: var(--font-digit); letter-spacing: 1px; }
.divider { height: 1px; background: var(--border); margin: 12px 0; }
.v-divider { width: 1px; background: var(--border); align-self: stretch; }

/* Light theme tweaks for sidebar/topbar */
:root[data-theme="light"] .sidebar {
  background: linear-gradient(180deg, #FFFFFF, #F7F9FD);
}
:root[data-theme="light"] .topbar {
  background: rgba(255,255,255,0.85);
}
:root[data-theme="light"] .app {
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(10,108,255,0.06), transparent 60%),
    var(--bg-base);
}
:root[data-theme="light"] .grid-bg {
  background-image:
    linear-gradient(rgba(10,108,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(10,108,255,0.05) 1px, transparent 1px);
}

/* Animations */
@keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.fade-in { animation: slideIn .25s ease both; }

@keyframes flow {
  to { stroke-dashoffset: -24; }
}
.flow-line { stroke-dasharray: 4 4; animation: flow 1s linear infinite; }

@keyframes blink-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>

/* global React */
// 图标库 - 简洁线性图标

  <script type="text/babel" data-presets="react">
/* global React, Icon */
// 共享组件: Sidebar, Topbar, KPI, Card, Charts (sparkline, line, ring, bar)
(() => {
const { useState, useEffect, useRef, useMemo } = React;

/* ============= 侧边栏 ============= */
const NAV = [
  { section: '运营监控' },
  { id: 'dashboard', label: '调度总览', icon: 'dashboard' },

function Sidebar({ active, onChange }) {

    <aside className="sidebar">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">

      </div>
      <nav className="nav">
        {NAV.map((n, i) => n.section ? (
          <div key={i} className="nav-section">{n.section}</div>
        ) : (
          <div key={n.id}
               className={`nav-item ${active === n.id ? 'active' : ''}`}
               onClick={() => onChange(n.id)}>
            <Icon name={n.icon} className="icon" size={17} />
            <span>{n.label}</span>
            {n.badge ? <span className="badge">{n.badge}</span> : null}

      </nav>
      <div className="sidebar-user">
        <div className="avatar">张</div>
        <div className="user-info">
          <div className="name">张志远</div>
          <div className="role">主调度员 · D-401</div>
        </div>
      </div>

}

/* ============= 顶栏 ============= */
const CRUMBS = {
  dashboard: ['运营监控', '调度总览大屏'],
  devices: ['运营监控', '设备管理'],
  load: ['运营监控', '负荷预测与分析'],
  alerts: ['运维管理', '告警事件中心'],
  tickets: ['运维管理', '运维工单'],
  energy: ['数据分析', '能耗统计报表'],
  renewable: ['数据分析', '新能源接入'],
};

function Topbar({ active }) {
  const [now, setNow] = useState(new Date());

    return () => clearInterval(t);
  }, []);

}

/* ============= Card ============= */
function Card({ title, tag, live, actions, children, glow, className = '', noPad, headerless, style }) {
  return (
    <div className={`card ${glow ? 'glow' : ''} ${className}`} style={style}>
      {glow && <div className="card-decoration"/>}
      {!headerless && (
        <div className="card-header">
          <h3>{title}</h3>
          {tag && <span className="tag">{tag}</span>}
          {live && <span className="live-dot">实时</span>}
          {actions && <div className="actions">{actions}</div>}

      )}
      <div className={noPad ? '' : 'card-body'}>{children}</div>
    </div>

}

/* ============= KPI ============= */
function KPI({ label, value, unit, delta, deltaLabel, color = 'var(--primary)', sparkData, status }) {
  const isUp = delta != null && delta >= 0;
  return (
    <div className="kpi" style={{ '--accent': color }}>
      <div className="label">{label}</div>
      <div className="value">
        {value}
        {unit && <span className="unit">{unit}</span>}
      </div>
      <div className="meta">
        {delta != null && (
          <span className={`delta ${isUp ? 'up' : 'down'}`}>
            <Icon name={isUp ? 'trending' : 'trendingDown'} size={11}/>
            {isUp ? '+' : ''}{delta}% {deltaLabel}
          </span>
        )}
        {status && <span className="chip dot" style={{color}}>{status}</span>}
      </div>
      {sparkData && <Sparkline data={sparkData} color={color} width={80} height={28} className="spark"/>}
    </div>
  );
}

/* ============= Charts ============= */
// Sparkline
function Sparkline({ data, color = 'var(--primary)', width = 80, height = 28, className, style }) {
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const points = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / range) * height * 0.85 - height * 0.075;
    return [x, y];
  });
  const path = points.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  const area = `${path} L${width},${height} L0,${height} Z`;
  const id = useMemo(() => 'sp' + Math.random().toString(36).slice(2, 8), []);
  return (
    <svg width={width} height={height} className={className} style={style}>
      <defs>
        <linearGradient id={id} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.35"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${id})`}/>
      <path d={path} fill="none" stroke={color} strokeWidth="1.5"/>
    </svg>
  );
}

// 折线图 (多系列, 网格, 提示线)
function LineChart({ series, labels, height = 220, yUnit = '', smooth = true, area = true, yMax: yMaxProp, showGrid = true }) {
  const [hover, setHover] = useState(null);
  const padL = 44, padR = 16, padT = 16, padB = 28;
  const W = 800, H = height;
  const allVals = series.flatMap(s => s.data);
  const yMax = yMaxProp || Math.ceil(Math.max(...allVals) * 1.1 / 50) * 50;
  const yMin = 0;
  const n = labels.length;
  const xAt = i => padL + (i / (n - 1)) * (W - padL - padR);
  const yAt = v => padT + (1 - (v - yMin) / (yMax - yMin)) * (H - padT - padB);

  const buildPath = (data, smoothed) => {
    if (!smoothed) {
      return data.map((v, i) => `${i ? 'L' : 'M'}${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
    }
    let d = `M${xAt(0)},${yAt(data[0])}`;
    for (let i = 1; i < data.length; i++) {
      const x0 = xAt(i - 1), y0 = yAt(data[i - 1]);
      const x1 = xAt(i), y1 = yAt(data[i]);
      const cx1 = x0 + (x1 - x0) / 2, cy1 = y0;
      const cx2 = x0 + (x1 - x0) / 2, cy2 = y1;
      d += ` C${cx1},${cy1} ${cx2},${cy2} ${x1},${y1}`;
    }
    return d;
  };

  const yTicks = 4;
  const ticks = Array.from({length: yTicks + 1}, (_, i) => Math.round(yMin + (yMax - yMin) * i / yTicks));

  const handleMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * W;
    const idx = Math.round((x - padL) / (W - padL - padR) * (n - 1));
    if (idx >= 0 && idx < n) setHover(idx);
  };

  return (
    <div style={{ position: 'relative', width: '100%' }}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} preserveAspectRatio="none"
           onMouseMove={handleMove} onMouseLeave={() => setHover(null)}>
        {showGrid && ticks.map((t, i) => {
          const y = yAt(t);
          return (
            <g key={i}>
              <line x1={padL} x2={W - padR} y1={y} y2={y} stroke="var(--border)" strokeDasharray="2 4"/>
              <text x={padL - 8} y={y + 4} fontSize="10" fill="var(--text-3)" textAnchor="end">{t}{yUnit}</text>
            </g>
          );
        })}
        {labels.map((l, i) => {
          if (i % Math.max(1, Math.floor(n / 8)) !== 0 && i !== n - 1) return null;
          return <text key={i} x={xAt(i)} y={H - padB + 16} fontSize="10" fill="var(--text-3)" textAnchor="middle">{l}</text>;
        })}
        {series.map((s, si) => {
          const p = buildPath(s.data, smooth);
          const areaP = `${p} L${xAt(s.data.length - 1)},${H - padB} L${padL},${H - padB} Z`;
          const id = `lc-${si}-${Math.random().toString(36).slice(2,6)}`;
          return (
            <g key={si}>
              {area && (
                <>
                  <defs>
                    <linearGradient id={id} x1="0" x2="0" y1="0" y2="1">
                      <stop offset="0%" stopColor={s.color} stopOpacity={s.dashed ? 0 : 0.32}/>
                      <stop offset="100%" stopColor={s.color} stopOpacity="0"/>
                    </linearGradient>
                  </defs>
                  <path d={areaP} fill={`url(#${id})`}/>
                </>
              )}
              <path d={p} fill="none" stroke={s.color} strokeWidth="2"
                    strokeDasharray={s.dashed ? '4 4' : undefined}
                    style={{filter: s.glow ? `drop-shadow(0 0 4px ${s.color})` : undefined}}/>
            </g>
          );
        })}
        {hover != null && (
          <g>
            <line x1={xAt(hover)} x2={xAt(hover)} y1={padT} y2={H - padB} stroke="var(--primary)" strokeDasharray="2 3" strokeWidth="1"/>
            {series.map((s, si) => (
              <circle key={si} cx={xAt(hover)} cy={yAt(s.data[hover])} r="4" fill={s.color} stroke="var(--bg-card)" strokeWidth="2"/>
            ))}
          </g>
        )}
      </svg>
      {hover != null && (
        <div style={{
          position: 'absolute',
          left: `${(xAt(hover) / W) * 100}%`,
          top: 8,
          transform: 'translateX(8px)',
          background: 'var(--bg-elevated)',
          border: '1px solid var(--border-strong)',
          borderRadius: 6,
          padding: '8px 10px',
          fontSize: 11,
          pointerEvents: 'none',
          minWidth: 120,
          boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
        }}>
          <div className="text-3" style={{marginBottom:4}}>{labels[hover]}</div>
          {series.map((s, si) => (
            <div key={si} style={{display:'flex',justifyContent:'space-between',gap:8}}>
              <span style={{display:'inline-flex',alignItems:'center',gap:5}}>
                <span style={{width:8,height:2,background:s.color,borderRadius:1}}/>
                {s.name}
              </span>
              <b className="text-digit">{s.data[hover]}{yUnit}</b>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// 柱状图
function BarChart({ data, labels, color = 'var(--primary)', height = 180, yUnit = '' }) {
  const padL = 36, padR = 8, padT = 12, padB = 24;
  const W = 600, H = height;
  const max = Math.ceil(Math.max(...data) * 1.15 / 100) * 100 || 100;
  const xAt = i => padL + (i + 0.5) / data.length * (W - padL - padR);
  const yAt = v => padT + (1 - v / max) * (H - padT - padB);
  const bw = (W - padL - padR) / data.length * 0.55;
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(t => Math.round(max * t));

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
      {ticks.map((t,i) => (
        <g key={i}>
          <line x1={padL} x2={W-padR} y1={yAt(t)} y2={yAt(t)} stroke="var(--border)" strokeDasharray="2 4"/>
          <text x={padL-6} y={yAt(t)+4} fontSize="10" fill="var(--text-3)" textAnchor="end">{t}{yUnit}</text>
        </g>
      ))}
      {data.map((v, i) => {
        const h = (H - padT - padB) * v / max;
        const gid = `bg-${i}-${Math.random().toString(36).slice(2,6)}`;
        return (
          <g key={i}>
            <defs>
              <linearGradient id={gid} x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stopColor={color} stopOpacity="0.95"/>
                <stop offset="100%" stopColor={color} stopOpacity="0.25"/>
              </linearGradient>
            </defs>
            <rect x={xAt(i)-bw/2} y={yAt(v)} width={bw} height={h} fill={`url(#${gid})`} rx={2}/>
            <text x={xAt(i)} y={H-padB+15} fontSize="10" fill="var(--text-3)" textAnchor="middle">{labels[i]}</text>
          </g>
        );
      })}
    </svg>
  );
}

// 环形进度图
function Ring({ percent, label, value, size = 120, color = 'var(--primary)', thickness = 8, subLabel }) {
  const r = (size - thickness) / 2;
  const C = 2 * Math.PI * r;
  const offset = C * (1 - percent / 100);
  return (
    <div style={{position:'relative', width: size, height: size, display:'inline-block'}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border)" strokeWidth={thickness}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={thickness}
                strokeDasharray={C} strokeDashoffset={offset} strokeLinecap="round"
                style={{transition:'stroke-dashoffset .6s ease', filter: `drop-shadow(0 0 6px ${color})`}}/>
      </svg>
      <div style={{position:'absolute', inset:0, display:'grid', placeItems:'center', textAlign:'center'}}>
        <div>
          <div className="text-digit" style={{fontSize: size*0.22, color: 'var(--text-1)'}}>{value ?? percent}</div>
          {label && <div className="text-3" style={{fontSize:11, marginTop:2}}>{label}</div>}
          {subLabel && <div className="text-mute" style={{fontSize:10, marginTop:1}}>{subLabel}</div>}
        </div>
      </div>
    </div>
  );
}

// 半圆仪表盘
function Gauge({ percent, label, value, color = 'var(--primary)', size = 160 }) {
  const r = 60, cx = size/2, cy = size*0.7;
  const startAngle = -180, endAngle = 0;
  const angle = startAngle + (endAngle - startAngle) * (percent / 100);
  const polar = (a) => {
    const rad = (a * Math.PI) / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  };
  const arc = (a1, a2) => {
    const [x1, y1] = polar(a1), [x2, y2] = polar(a2);
    const large = a2 - a1 > 180 ? 1 : 0;
    return `M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2}`;
  };
  return (
    <div style={{position:'relative', width:size, height: size*0.75}}>
      <svg viewBox={`0 0 ${size} ${size*0.75}`} width="100%" height="100%">
        <path d={arc(startAngle, endAngle)} fill="none" stroke="var(--border)" strokeWidth="10" strokeLinecap="round"/>
        <path d={arc(startAngle, angle)} fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"
              style={{filter: `drop-shadow(0 0 6px ${color})`}}/>
      </svg>
      <div style={{position:'absolute', inset:0, display:'grid', placeItems:'center', textAlign:'center', paddingTop:14}}>
        <div>
          <div className="text-digit" style={{fontSize:24, color:'var(--text-1)'}}>{value ?? percent + '%'}</div>
          {label && <div className="text-3" style={{fontSize:11, marginTop:2}}>{label}</div>}
        </div>
      </div>
    </div>
  );
}

// 数据模拟工具
function genWave(n, base, amp, phase = 0, noise = 0.1) {
  return Array.from({length: n}, (_, i) => {
    const x = (i / n) * Math.PI * 2 + phase;
    return Math.round(base + Math.sin(x) * amp + (Math.random() - 0.5) * amp * noise);
  });
}

function useTick(interval = 2000) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setTick(x => x + 1), interval);
    return () => clearInterval(t);
  }, [interval]);
  return tick;
}

/* ============= Modal ============= */
function Modal({ title, onClose, onConfirm, confirmLabel = '确认提交', children, width = 520 }) {
  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 9999,
      background: 'rgba(5,11,26,0.75)',
      backdropFilter: 'blur(4px)',
      display: 'grid', placeItems: 'center',

      <div className="card" style={{
        width, maxWidth: 'calc(100vw - 48px)',
        maxHeight: 'calc(100vh - 80px)',

        border: '1px solid var(--border-strong)',

          <h3 style={{fontSize: 15}}>{title}</h3>
          <div className="actions">
            <button className="btn icon-only ghost" onClick={onClose}>
              <Icon name="x" size={15}/>
            </button>
          </div>
        </div>
        <div style={{overflowY: 'auto', padding: '20px 20px 8px'}}>
          {children}
        </div>
        <div style={{
          display: 'flex', justifyContent: 'flex-end', gap: 8,
          padding: '12px 20px 16px',
          borderTop: '1px solid var(--border)',
          flexShrink: 0,
        }}>
          <button className="btn" onClick={onClose}>取消</button>
          <button className="btn primary" onClick={onConfirm}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

/* ============= FormField ============= */
function FormField({ label, required, children }) {
  return (
    <div style={{marginBottom: 16}}>
      <div style={{
        fontSize: 12, color: 'var(--text-3)',
        marginBottom: 6, letterSpacing: 0.5,

}

function FormInput({ value, onChange, placeholder }) {

    <input value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}

function FormSelect({ value, onChange, options }) {

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function AddDeviceModal({ onClose, onAdd }) {
  const [form, setForm] = useState({ id:'', name:'', type:'变电站', voltage:'220kV', area:'', status:'normal' });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  return (
    <Modal title="新增设备" onClose={onClose} onConfirm={() => { onAdd(form); onClose(); }}>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0 16px'}}>
        <FormField label="设备编号" required>
          <FormInput value={form.id} onChange={v => set('id', v)} placeholder="如 SUB-2204"/>
        </FormField>
        <FormField label="设备名称" required>
          <FormInput value={form.name} onChange={v => set('name', v)} placeholder="如 西部220kV变电站"/>
        </FormField>
        <FormField label="设备类型" required>
          <FormSelect value={form.type} onChange={v => set('type', v)}
            options={['变电站','输电线路','变压器','开关站']}/>
        </FormField>
        <FormField label="电压等级" required>
          <FormSelect value={form.voltage} onChange={v => set('voltage', v)}
            options={['500kV','220kV','110kV','10kV']}/>
        </FormField>
        <FormField label="所属区域" required>
          <FormInput value={form.area} onChange={v => set('area', v)} placeholder="如 西部新区"/>
        </FormField>
        <FormField label="初始状态">
          <FormSelect value={form.status} onChange={v => set('status', v)}
            options={[{value:'normal',label:'正常'},{value:'warning',label:'预警'},{value:'danger',label:'告警'}]}/>

      <FormField label="备注">
        <FormTextarea value={form.remark || ''} onChange={v => set('remark', v)} placeholder="可选，填写设备备注信息" rows={2}/>

    </Modal>
  );
}

    if (!form.id || !form.name) return;
    setDevices(prev => [{
      ...form, load: 0, runtime: '0年', last: new Date().toISOString().slice(0,10), count: 0,
    }, ...prev]);

    (type === '全部' || d.type === type) &&
    (voltage === '全部' || d.voltage === voltage) &&
    (!search || d.name.includes(search) || d.id.includes(search))

    <div className="fade-in" style={{display:'grid', gridTemplateColumns:'1fr 420px', gap:16, height:'100%'}}>

function AlertTimeline({ alerts }) {
  // 将时间 -> x 位置

  const positions = alerts.map(a => {
    const [h, m] = a.time.split(':').map(Number);
    const minutes = h * 60 + m;
    return { ...a, x: minutes };
  });
  const minX = 13 * 60, maxX = 15 * 60; // 关注 13:00-15:00 窗口
  const W = 800, H = 80;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
      {/* 主轴 */}
      <line x1="0" x2={W} y1={H/2} y2={H/2} stroke="var(--border-strong)" strokeWidth="1"/>
      {/* 刻度 */}
      {Array.from({length: 13}, (_, i) => {
        const t = minX + (maxX - minX) * i / 12;
        const x = (t - minX) / (maxX - minX) * W;
        const isHour = t % 60 === 0;
        return (
          <g key={i}>
            <line x1={x} x2={x} y1={H/2 - (isHour ? 6 : 3)} y2={H/2 + (isHour ? 6 : 3)} stroke="var(--text-3)"/>
            {isHour && <text x={x} y={H/2 + 22} fontSize="10" fill="var(--text-3)" textAnchor="middle">
              {String(Math.floor(t/60)).padStart(2,'0')}:00
            </text>}
          </g>
        );

      {/* 现在标记 */}
      <line x1={(14*60+35-minX)/(maxX-minX)*W} x2={(14*60+35-minX)/(maxX-minX)*W} y1="6" y2={H-6}

      {/* 告警点 */}
      {positions.filter(p => p.x >= minX && p.x <= maxX).map((p, i) => {
        const x = (p.x - minX) / (maxX - minX) * W;
        const lv = LEVEL_MAP[p.level];
        return (
          <g key={i}>
            <line x1={x} x2={x} y1={H/2} y2={H/2 - 18} stroke={lv.color} strokeWidth="1" opacity="0.5"/>
            <circle cx={x} cy={H/2 - 22} r="5" fill={lv.color} style={{filter:`drop-shadow(0 0 4px ${lv.color})`}}/>
            <circle cx={x} cy={H/2 - 22} r="9" fill="none" stroke={lv.color} opacity="0.3"/>
          </g>
        );
      })}

  );

function ProcessTimeline({ alert }) {
  const steps = [
    { time: '14:32:08', label: '告警触发', desc: 'SCADA 自动采集异常', done: true, icon: 'alert' },

    { time: alert.status === 'resolved' ? '14:38:22' : '', label: '派发工单', desc: alert.status === 'resolved' ? '已生成工单 WO-2025111313' : '待派发', done: alert.status === 'resolved', icon: 'ticket' },
    { time: alert.status === 'resolved' ? '14:42:15' : '', label: '故障恢复', desc: alert.status === 'resolved' ? '已恢复正常运行' : '待恢复', done: alert.status === 'resolved', icon: 'shield' },
  ];

  return (
    <div style={{position:'relative'}}>
      {steps.map((s, i) => (
        <div key={i} style={{display:'flex', gap:12, position:'relative', paddingBottom: i < steps.length - 1 ? 18 : 0}}>
          {i < steps.length - 1 && (
            <div style={{
              position:'absolute', left:13, top:30, bottom:0, width:2,
              background: s.done ? 'var(--success)' : 'var(--border-strong)',
            }}/>

          <div style={{
            width:28, height:28, borderRadius:'50%',

            color: s.done ? 'var(--success)' : 'var(--text-3)',
            display:'grid', placeItems:'center',
            flexShrink:0, zIndex:1,
            border: s.done ? '2px solid var(--success)' : '2px solid var(--border-strong)',
          }}>
            <Icon name={s.icon} size={12}/>
          </div>
          <div style={{flex:1}}>
            <div style={{display:'flex', justifyContent:'space-between', gap:8}}>
              <b style={{fontSize:13, color: s.done ? 'var(--text-1)' : 'var(--text-3)'}}>{s.label}</b>
              <span className="text-3 text-xs text-digit">{s.time || '待执行'}</span>
            </div>
            <div className="text-3 text-xs" style={{marginTop:2}}>{s.desc}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

window.AlertsScreen = AlertsScreen;

function DeltaTag({ value, lowerIsBetter = false }) {
  const isUp = value >= 0;
  const good = lowerIsBetter ? !isUp : isUp;
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:2,
      color: good ? 'var(--success)' : 'var(--danger)',
      fontSize:12,
    }}>
      <Icon name={isUp ? 'trending' : 'trendingDown'} size={11}/>
      <span className="text-digit">{isUp ? '+' : ''}{value}%</span>
    </span>
  );
}

function DonutChart({ data, size = 200 }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  const r = size/2 - 20;
  const C = 2 * Math.PI * r;
  let acc = 0;

  return (
    <div style={{position:'relative', width:size, height:size}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        {data.map((d, i) => {
          const start = acc;
          const len = (d.value / total) * C;
          acc += d.value;
          return (
            <circle key={i}
                    cx={size/2} cy={size/2} r={r}
                    fill="none"
                    stroke={d.color}
                    strokeWidth="22"
                    strokeDasharray={`${len} ${C}`}
                    strokeDashoffset={-(start / total) * C}
                    style={{filter: `drop-shadow(0 0 4px ${d.color})`}}/>
          );
        })}
      </svg>
      <div style={{position:'absolute', inset:0, display:'grid', placeItems:'center', textAlign:'center'}}>
        <div>
          <div className="text-3 text-xs" style={{letterSpacing:1}}>累计</div>
          <div className="text-digit" style={{fontSize:24}}>{total}</div>
          <div className="text-3 text-xs">亿 kWh</div>
        </div>
      </div>
      <div style={{position:'absolute', right:-20, top:0, display:'flex', flexDirection:'column', gap:6, fontSize:11}}>
        {data.map((d, i) => (
          <div key={i} style={{display:'flex', alignItems:'center', gap:6}}>
            <span style={{width:8, height:8, background:d.color, borderRadius:2, boxShadow:`0 0 4px ${d.color}`}}/>
            <span style={{minWidth:34}}>{d.name}</span>
            <span className="text-digit text-3">{d.value}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

window.EnergyScreen = EnergyScreen;

                ))}
              </>}
              glow noPad style={{flex:'1 1 0', minHeight:0}}>
          <GeoMap sites={filtered} selected={selected} onSelect={setSelected}/>
        </Card>

        <Card title="新能源出力曲线" tag="24H" live>
          <div style={{display:'flex', gap:14, marginBottom:8}}>
            <span style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:12}}>
              <span style={{width:14,height:2,background:'#FFAB2D'}}/>光伏
            </span>
            <span style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:12}}>
              <span style={{width:14,height:2,background:'#25C6FF'}}/>风电
            </span>
            <span style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:12}}>
              <span style={{width:14,height:2,background:'#2EE6D6'}}/>储能(±)
            </span>
          </div>
          <LineChart
            height={200}
            labels={dayLabels}
            yUnit="MW"
            yMax={600}
            series={[
              { name:'光伏', data:solarCurve, color:'#FFAB2D', glow:true },
              { name:'风电', data:windCurve, color:'#25C6FF', glow:true },
              { name:'储能', data:storageCurve.map(v=>v+200), color:'#2EE6D6' },
            ]}/>
        </Card>
      </div>

      {/* 右: 详情 */}
      <div style={{minWidth:0, display:'flex', flexDirection:'column', gap:12}}>
        <Card headerless noPad glow style={{padding:16}}>
          <div className="card-decoration"/>
          <div style={{display:'flex', alignItems:'center', gap:10}}>
            <div style={{
              width:42, height:42, borderRadius:'50%',
              background: `${COLOR_MAP[selected.type]}22`,
              border: `1px solid ${COLOR_MAP[selected.type]}`,
              display:'grid', placeItems:'center',
              color: COLOR_MAP[selected.type],
              boxShadow: `0 0 12px ${COLOR_MAP[selected.type]}`,
            }}>
              <Icon name={ICON_MAP[selected.type]} size={20}/>
            </div>
            <div style={{flex:1}}>
              <div className="text-3 text-xs">{selected.id} · {TYPE_LABEL[selected.type]}</div>
              <h2 style={{margin:'2px 0', fontSize:16}}>{selected.name}</h2>
              <div className="text-3 text-xs">{selected.region}</div>
            </div>
            <span className={`status-pill ${selected.status}`}>
              {selected.status === 'normal' ? '正常' : '预警'}
            </span>
          </div>

          <div style={{display:'flex', justifyContent:'center', margin:'14px 0 6px'}}>
            <Ring percent={selected.cur/selected.cap*100} 
                  value={selected.cur} 
                  label="当前出力 MW"
                  subLabel={`/ 容量 ${selected.cap}MW`}
                  size={150}
                  color={COLOR_MAP[selected.type]}
                  thickness={10}/>
          </div>

          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginTop:10, fontSize:12}}>
            <div style={{padding:10, background:'var(--bg-elevated)', borderRadius:'var(--r-md)'}}>
              <div className="text-3 text-xs">利用率</div>
              <div className="text-digit" style={{fontSize:18, color:COLOR_MAP[selected.type]}}>{Math.round(selected.cur/selected.cap*100)}%</div>
            </div>
            <div style={{padding:10, background:'var(--bg-elevated)', borderRadius:'var(--r-md)'}}>
              <div className="text-3 text-xs">今日发电</div>
              <div className="text-digit" style={{fontSize:18}}>{Math.round(selected.cur * 7.2)} <span className="text-3 text-xs">MWh</span></div>
            </div>
            {selected.type === 'storage' && (
              <>
                <div style={{padding:10, background:'var(--bg-elevated)', borderRadius:'var(--r-md)'}}>
                  <div className="text-3 text-xs">SOC 荷电态</div>
                  <div className="text-digit" style={{fontSize:18, color:'var(--success)'}}>{selected.soc}%</div>
                </div>
                <div style={{padding:10, background:'var(--bg-elevated)', borderRadius:'var(--r-md)'}}>
                  <div className="text-3 text-xs">状态</div>
                  <div className="text-digit" style={{fontSize:18, color:'var(--success)'}}>放电中</div>
                </div>
              </>
            )}
            {selected.type === 'solar' && (
              <>
                <div style={{padding:10, background:'var(--bg-elevated)', borderRadius:'var(--r-md)'}}>
                  <div className="text-3 text-xs">辐照度</div>
                  <div className="text-digit" style={{fontSize:18, color:'var(--warning)'}}>682 <span className="text-3 text-xs">W/m²</span></div>
                </div>
                <div style={{padding:10, background:'var(--bg-elevated)', borderRadius:'var(--r-md)'}}>
                  <div className="text-3 text-xs">组件温度</div>
                  <div className="text-digit" style={{fontSize:18}}>42.6°C</div>
                </div>
              </>
            )}
            {selected.type === 'wind' && (
              <>
                <div style={{padding:10, background:'var(--bg-elevated)', borderRadius:'var(--r-md)'}}>
                  <div className="text-3 text-xs">风速</div>
                  <div className="text-digit" style={{fontSize:18, color:'var(--info)'}}>8.4 <span className="text-3 text-xs">m/s</span></div>
                </div>
                <div style={{padding:10, background:'var(--bg-elevated)', borderRadius:'var(--r-md)'}}>
                  <div className="text-3 text-xs">在线机组</div>
                  <div className="text-digit" style={{fontSize:18}}>34<span className="text-3 text-xs">/36</span></div>
                </div>
              </>
            )}
          </div>
        </Card>

        <Card title="近 7 日发电量" tag="MWh">
          <div style={{display:'flex', flexDirection:'column', gap:8}}>
            {['11.07','11.08','11.09','11.10','11.11','11.12','今日'].map((d, i) => {
              const v = Math.round(1200 + (Math.sin(i)+1) * 600);
              const w = v / 2400 * 100;
              return (
                <div key={i} style={{display:'flex', alignItems:'center', gap:10}}>
                  <span className="text-3 text-xs" style={{width:42}}>{d}</span>
                  <div style={{flex:1, height:14, background:'var(--bg-elevated)', borderRadius:7, overflow:'hidden', position:'relative'}}>
                    <div style={{
                      width:`${w}%`, height:'100%',
                      background:`linear-gradient(90deg, ${COLOR_MAP[selected.type]}, ${COLOR_MAP[selected.type]}88)`,
                      boxShadow:`0 0 6px ${COLOR_MAP[selected.type]}`,
                    }}/>
                  </div>
                  <span className="text-digit text-sm" style={{minWidth:46, textAlign:'right'}}>{v}</span>
                </div>
              );
            })}
          </div>
        </Card>
      </div>
    </div>
  );
}

function GeoMap({ sites, selected, onSelect }) {
  return (
    <div style={{position:'relative', width:'100%', height:'100%', minHeight: 400, background:'radial-gradient(circle at 50% 40%, rgba(10,108,255,0.08), transparent 60%)', overflow:'hidden'}}>
      {/* 地图轮廓 SVG */}
      <svg viewBox="0 0 100 80" preserveAspectRatio="none" style={{position:'absolute', inset:0, width:'100%', height:'100%'}}>
        <defs>
          <pattern id="map-grid" width="4" height="4" patternUnits="userSpaceOnUse">
            <path d="M 4 0 L 0 0 0 4" fill="none" stroke="rgba(10,108,255,0.06)" strokeWidth="0.1"/>
          </pattern>
        </defs>
        <rect width="100" height="80" fill="url(#map-grid)"/>
        {/* 区域轮廓 */}
        <path d="M 5 30 Q 12 12 28 14 Q 42 8 58 12 Q 72 8 84 18 Q 92 32 88 48 Q 92 60 82 70 Q 64 76 48 72 Q 32 76 20 70 Q 8 60 5 48 Z"
              fill="rgba(10,108,255,0.04)" stroke="rgba(10,108,255,0.3)" strokeWidth="0.3"
              vectorEffect="non-scaling-stroke"/>
        {/* 内部分区线 */}
        <path d="M 50 12 Q 48 40 50 70" fill="none" stroke="rgba(10,108,255,0.18)" strokeWidth="0.2" strokeDasharray="1 1" vectorEffect="non-scaling-stroke"/>
        <path d="M 8 40 Q 48 38 90 42" fill="none" stroke="rgba(10,108,255,0.18)" strokeWidth="0.2" strokeDasharray="1 1" vectorEffect="non-scaling-stroke"/>
        {/* 水波纹 */}
        {sites.map(s => {
          const color = COLOR_MAP[s.type];
          return (
            <g key={`r-${s.id}`}>
              <circle cx={s.x} cy={s.y} r="1.5" fill="none" stroke={color} strokeWidth="0.2"
                      vectorEffect="non-scaling-stroke" opacity="0.6">
                <animate attributeName="r" from="1.5" to="6" dur="2.5s" repeatCount="indefinite" begin={`${Math.random()}s`}/>
                <animate attributeName="opacity" from="0.6" to="0" dur="2.5s" repeatCount="indefinite" begin={`${Math.random()}s`}/>
              </circle>
            </g>
          );
        })}
      </svg>

      {/* 区域标签 */}
      {[
        {x:30,y:25,name:'北区'},{x:72,y:25,name:'东北'},
        {x:30,y:62,name:'南区'},{x:72,y:62,name:'东南'},
      ].map((r, i) => (
        <div key={i} style={{
          position:'absolute', left:`${r.x}%`, top:`${r.y}%`, transform:'translate(-50%,-50%)',
          color:'var(--text-mute)', fontSize:11, letterSpacing:2, pointerEvents:'none',
        }}>{r.name}</div>
      ))}

      {/* 场站标记 */}
      {sites.map(s => {
        const color = COLOR_MAP[s.type];
        const isSel = selected?.id === s.id;
        return (
          <div key={s.id}
               onClick={()=>onSelect(s)}
               style={{
                 position:'absolute',
                 left:`${s.x}%`, top:`${s.y}%`,
                 transform:'translate(-50%,-50%)',
                 cursor:'pointer',
                 textAlign:'center',
                 zIndex: isSel ? 20 : 5,
               }}>
            <div style={{
              width: 36, height: 36, borderRadius: s.type === 'storage' ? '6px' : '50%',
              background: `radial-gradient(circle, ${color}33, transparent 70%)`,
              border: `2px solid ${color}`,
              boxShadow: `0 0 ${isSel ? 16 : 8}px ${color}`,
              display:'grid', placeItems:'center', color,
              backgroundColor:'rgba(8,17,31,0.85)',
              transform: isSel ? 'scale(1.2)' : 'scale(1)',
              transition:'all .2s',
            }}>
              <Icon name={ICON_MAP[s.type]} size={16}/>
            </div>
            <div style={{
              marginTop:4, fontSize:10, color:'var(--text-1)',
              textShadow:'0 0 6px rgba(0,0,0,0.9)',
              whiteSpace:'nowrap', pointerEvents:'none',
            }}>
              <b>{s.name}</b>
              <div className="text-3" style={{fontSize:9, marginTop:1}}>
                <span className="text-digit" style={{color}}>{s.cur}</span>/{s.cap} MW
              </div>
            </div>
          </div>
        );
      })}

      {/* 角标实时统计 */}
      <div style={{
        position:'absolute', top:16, right:16,
        background:'rgba(8,17,31,0.85)',
        border:'1px solid var(--primary-border)',
        borderRadius:'var(--r-md)',
        padding:'10px 14px', minWidth:160,
        backdropFilter:'blur(10px)', fontSize:11,
      }}>
        <div className="text-3 text-xs mb-2" style={{letterSpacing:2}}>实时统计</div>
        {['solar','wind','storage'].map(t => {
          const list = SITES.filter(s => s.type === t);
          const cur = list.reduce((s,x)=>s+x.cur,0);
          const cap = list.reduce((s,x)=>s+x.cap,0);
          return (
            <div key={t} style={{display:'flex', justifyContent:'space-between', gap:12, padding:'4px 0', borderTop: t!=='solar'?'1px dashed var(--border)':'none'}}>
              <span style={{display:'inline-flex',alignItems:'center',gap:6, color: COLOR_MAP[t]}}>
                <Icon name={ICON_MAP[t]} size={12}/> {TYPE_LABEL[t]}
              </span>
              <span><b className="text-digit">{cur}</b><span className="text-3">/{cap}MW</span></span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

window.RenewableScreen = RenewableScreen;
})();
  </script>
  <script type="text/babel" data-presets="react">
/* global React, ReactDOM, Sidebar, Topbar,
   DashboardScreen, DevicesScreen, LoadScreen, AlertsScreen, TicketsScreen, EnergyScreen, RenewableScreen,
   TweaksPanel, useTweaks, TweakSection, TweakColor, TweakRadio, TweakSelect */
(() => {
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primaryColor": "#0A6CFF",
  "theme": "dark",
  "density": "default",
  "radius": "default",
  "chartStyle": "smooth"
}/*EDITMODE-END*/;

// 颜色调色板 (HEX -> oklch hover/active 计算太复杂, 用预设主色)
const COLOR_MAP = {
  '#0A6CFF': { primary: '#0A6CFF', hover: '#2D85FF', active: '#0856D6', glow: 'rgba(10,108,255,0.45)', soft: 'rgba(10,108,255,0.12)', border: 'rgba(10,108,255,0.32)' },
  '#25C6FF': { primary: '#25C6FF', hover: '#4FD4FF', active: '#0AA3DB', glow: 'rgba(37,198,255,0.5)', soft: 'rgba(37,198,255,0.14)', border: 'rgba(37,198,255,0.36)' },
  '#2EE6D6': { primary: '#2EE6D6', hover: '#5BF0E2', active: '#13C2B2', glow: 'rgba(46,230,214,0.5)', soft: 'rgba(46,230,214,0.14)', border: 'rgba(46,230,214,0.36)' },
  '#9D7BFF': { primary: '#9D7BFF', hover: '#B59DFF', active: '#7855E0', glow: 'rgba(157,123,255,0.5)', soft: 'rgba(157,123,255,0.14)', border: 'rgba(157,123,255,0.36)' },
};

function App() {
  const [active, setActive] = useState('dashboard');
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // 应用主题
  useEffect(() => {
    const root = document.documentElement;
    root.setAttribute('data-theme', t.theme);
    root.setAttribute('data-density', t.density);
    root.setAttribute('data-radius', t.radius);

    const c = COLOR_MAP[t.primaryColor] || COLOR_MAP['#0A6CFF'];
    root.style.setProperty('--primary', c.primary);
    root.style.setProperty('--primary-hover', c.hover);
    root.style.setProperty('--primary-active', c.active);
    root.style.setProperty('--primary-glow', c.glow);
    root.style.setProperty('--primary-soft', c.soft);
    root.style.setProperty('--primary-border', c.border);
    root.style.setProperty('--chart-1', c.primary);
  }, [t]);

  const Screen = {
    dashboard: DashboardScreen,
    devices: DevicesScreen,
    load: LoadScreen,
    alerts: AlertsScreen,
    tickets: TicketsScreen,
    energy: EnergyScreen,
    renewable: RenewableScreen,
  }[active] || DashboardScreen;

  return (
    <div className="app" data-screen-label={active}>
      <Sidebar active={active} onChange={setActive}/>
      <Topbar active={active}/>
      <main className="main">
        <Screen key={active}/>
      </main>

      <TweaksPanel title="Tweaks" defaultOpen={false}>
        <TweakSection title="主色调">
          <TweakColor
            label="主色"
            value={t.primaryColor}
            onChange={v => setTweak('primaryColor', v)}
            options={['#0A6CFF', '#25C6FF', '#2EE6D6', '#9D7BFF']}/>
        </TweakSection>

        <TweakSection title="主题">
          <TweakRadio
            label="深浅主题"
            value={t.theme}
            onChange={v => setTweak('theme', v)}
            options={[
              { value: 'dark', label: '深色' },
              { value: 'light', label: '浅色' },
            ]}/>
        </TweakSection>

        <TweakSection title="界面密度">
          <TweakRadio
            label="字号 / 间距"
            value={t.density}
            onChange={v => setTweak('density', v)}
            options={[
              { value: 'compact', label: '紧凑' },
              { value: 'default', label: '标准' },
              { value: 'comfortable', label: '宽松' },
            ]}/>
        </TweakSection>

        <TweakSection title="圆角">
          <TweakRadio
            label="圆角风格"
            value={t.radius}
            onChange={v => setTweak('radius', v)}
            options={[
              { value: 'sharp', label: '直角' },
              { value: 'default', label: '标准' },
              { value: 'soft', label: '柔和' },
            ]}/>
        </TweakSection>

        <TweakSection title="图表">
          <TweakRadio
            label="曲线样式"
            value={t.chartStyle}
            onChange={v => setTweak('chartStyle', v)}
            options={[
              { value: 'smooth', label: '平滑' },
              { value: 'linear', label: '折线' },
            ]}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();
  </script>
</body>
</html>
